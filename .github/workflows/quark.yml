# Copy into the plugin repository. Hub replaces {{package_name}} on installation.

name: BedrockNexus Publish (Quark)

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out plugin source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up PHP for Quark 6
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Check Quark compatibility
        run: |
          if [ -f composer.json ]; then
            if ! grep -q '"quark/quark"' composer.json; then
              echo "::warning::Composer configuration does not declare quark/quark"
            fi
          fi

      - name: Check PHP syntax
        run: |
          if [ -d src ]; then
            find src -name '*.php' -print0 | xargs -0 -r -n1 php -l
          fi

      - name: Build with DevTools
        id: build
        uses: AxolotlBucketLabs/DevTools@04fd726101109739bf1fd629dbe8499d3e2864bb # v3.0.0
        with:
          project: .
          virions: .devtools-virions
          output: build
          prepare-dependencies: ${{ hashFiles('composer.lock') != '' }}

      - name: Stage the plugin file
        env:
          SOURCE_PHAR: ${{ steps.build.outputs.phar }}
          OUTPUT_PHAR: 'dist/{{package_name}}.phar'
        run: |
          mkdir -p dist
          cp -- "$SOURCE_PHAR" "$OUTPUT_PHAR"

      - name: Upload plugin for build selection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-package
          path: 'dist/{{package_name}}.phar'
          if-no-files-found: error
