# Copy into the plugin repository. Hub replaces {{package_name}} on installation.
name: BedrockNexus Publish

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out plugin source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up PHP for Quark V6
        uses: Bedrock-Phanatics/setup-php-action@fded70a36fb7f9ee7c1150276cf55ed37367811c # 1.0.0
        with:
          php-version: '8.4'
          install-path: ../bin
          pm-version-major: '5'

      - name: Check PHP syntax
        run: find src -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Validate plugin manifest
        run: |
          if [[ ! -f plugin.toml ]]; then
            echo "::error::plugin.toml is missing from the project root."
            exit 1
          fi

      - name: Install Composer dependencies
        if: hashFiles('composer.json') != ''
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Download Pharynx
        run: |
          curl -fL \
            https://github.com/BedrockNexus/pharynx/releases/latest/download/pharynx.phar \
            -o "$RUNNER_TEMP/pharynx.phar"

      - name: Build plugin with Pharynx
        run: |
          mkdir -p dist

          BUILD_ARGS=(
            -s "src"
            -p "dist/{{package_name}}.phar"
          )

          if [[ -d resources ]]; then
            BUILD_ARGS+=(-f "resources:resources")
          fi

          if [[ -f composer.json ]]; then
            BUILD_ARGS+=(-c)
          fi

          php "$RUNNER_TEMP/pharynx.phar" "${BUILD_ARGS[@]}"

          test -s "dist/{{package_name}}.phar"

      - name: Upload plugin for build selection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-package
          path: 'dist/{{package_name}}.phar'
          if-no-files-found: error
